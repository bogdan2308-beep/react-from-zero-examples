<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>React from Zero — Components</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
      .app { padding: 2rem; max-width: 800px; margin: 0 auto; }
      .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
      .component-card { min-height: 100px; background: #f8f9fa; }
    </style>
  </head>
  <body>
    <div id="root" class="app"></div>
    
    <script type="text/babel">
      // Example 2: Function component with props
      // From Chapter 2 of "React from Zero"
      
      function Welcome({ name }) {
        return React.createElement('div', { className: 'component-card' },
          React.createElement('h2', null, `Welcome, ${name}!`)
        );
      }
      
      const app = React.createElement(Welcome, { name: 'Developer' }, null);
      ReactDOM.render(app, document.getElementById('root'));
    </script>
  </body>
</html>
