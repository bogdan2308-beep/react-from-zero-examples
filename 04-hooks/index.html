<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>React from Zero — Custom Hooks</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
      .app { padding: 2rem; max-width: 800px; margin: 0 auto; }
      .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="root" class="app"></div>
    
    <script type="text/babel">
      // Example 4: Custom hook for data fetching
      // From Chapter 4 of "React from Zero"
      
      function useFetch(url) {
        const [data, setData] = React.useState(null);
        const [loading, setLoading] = React.useState(true);
        const [error, setError] = React.useState(null);
        
        React.useEffect(() => {
          async function fetchData() {
            setLoading(true);
            try {
              const response = await fetch(url);
              const result = await response.json();
              setData(result);
            } catch (e) {
              setError(e);
            } finally {
              setLoading(false);
            }
          }
          fetchData();
        }, [url]);
        
        return { data, loading, error };
      }
      
      function UserList() {
        const { data, loading, error } = useFetch('https://api.github.com/users');
        
        if (loading) {
          return React.createElement('div', null, 'Loading...');
        }
        if (error) {
          return React.createElement('div', null, `Error: ${error.message}`);
        }
        
        return React.createElement('div', { className: 'card' },
          React.createElement('h2', null, 'GitHub Users'),
          React.createElement('ul', null,
            data.slice(0, 5).map(user =>
              React.createElement('li', { key: user.id },
                React.createElement('a', { href: user.html_url, target: '_blank' }, user.login)
              )
            )
          )
        );
      }
      
      ReactDOM.render(React.createElement(UserList), document.getElementById('root'));
    </script>
  </body>
</html>
